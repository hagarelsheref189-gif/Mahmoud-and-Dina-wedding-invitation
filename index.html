<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Mahmoud &amp; Dina · Wedding invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  /* ---------- Tokens ---------- */
  :root {
    --bg-a: #f6f3ee;          /* marble highlight */
    --bg-b: #d9d4ca;          /* marble shade */
    --ink: #243660;           /* delft navy */
    --ink-soft: #5a6688;
    --shadow: rgba(36, 44, 72, .42);
    --seal-ring: #2d4a8a;     /* sits on the paper, so it stays the same in every theme */
    --liner-a: #f3eee2;
    --liner-b: #e2dac8;
    --ease-door: cubic-bezier(.55, .05, .2, 1);
    --ease-soft: cubic-bezier(.2, .8, .2, 1);

    /* envelope geometry (measured from the artwork) */
    --ratio: .68;
    --seal-x: 50.67%;
    --seal-y: 49.74%;
    --seal-d: 26%;

    color-scheme: light dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-a: #1d2c52;
      --bg-b: #0b1326;
      --ink: #ece6d8;
      --ink-soft: #aab4d0;
      --shadow: rgba(0, 0, 0, .65);
    }
  }
  :root[data-theme="dark"] {
    --bg-a: #1d2c52;
    --bg-b: #0b1326;
    --ink: #ece6d8;
    --ink-soft: #aab4d0;
    --shadow: rgba(0, 0, 0, .65);
  }

  /* ---------- Base ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html {
    height: 100%;
    scroll-padding-top: env(safe-area-inset-top, 0px);
    overflow: hidden;
  }
  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background-color: var(--bg-b);
    background-image: radial-gradient(120% 90% at 50% 28%, var(--bg-a) 0%, var(--bg-b) 100%);
    color: var(--ink);
    font-family: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ---------- Layout ---------- */
  .scene {
    --reserve: calc(150px + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px));
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 2.6vh, 26px);
    padding: 12px;
  }
  @media (max-height: 520px) { .scene { --reserve: 96px; } }

  .stage { animation: arrive 1.3s cubic-bezier(.2, .7, .2, 1) backwards; }
  @keyframes arrive {
    from { opacity: 0; transform: translateY(26px) rotate(-1.4deg); }
    to   { opacity: 1; transform: none; }
  }

  .envelope {
    --w: min(86vw, calc((100svh - var(--reserve)) * var(--ratio)), 540px);
    position: relative;
    isolation: isolate;
    width: var(--w);
    aspect-ratio: 525 / 772;
  }
  @supports not (height: 100svh) {
    .envelope { --w: min(86vw, calc((100vh - var(--reserve)) * var(--ratio)), 540px); }
  }

  /* soft shadow under the closed envelope */
  .plate {
    position: absolute; inset: 0; z-index: 0;
    border-radius: 3px;
    box-shadow: 0 38px 60px -24px var(--shadow), 0 14px 26px -12px var(--shadow);
    transition: opacity .6s ease 1.7s;
  }
  .scene.is-open .plate { opacity: 0; transition-delay: .5s; }

  /* ---------- The card inside ---------- */
  .card {
    position: absolute; left: 50%; top: 50%; z-index: 1;
    width: 93%;
    aspect-ratio: 993 / 1446;
    display: block;
    border-radius: 2px;
    transform: translate(-50%, -50%) scale(.965);
    box-shadow: 0 2px 6px rgba(0, 0, 0, .12);
    transition: transform 1s cubic-bezier(.4, 0, .2, 1), box-shadow 1s ease;
    will-change: transform;
    user-select: none;
  }
  .card img {
    display: block; width: 100%; height: 100%;
    border-radius: inherit;
    -webkit-user-drag: none;
  }

  /* tappable location on the card (box is a % of the card, so it scales with it) */
  .map-link {
    position: absolute;
    left: 12%; top: 62%;
    width: 35%; height: 15%;
    border-radius: 8px;
    visibility: hidden;                 /* not clickable or focusable while the envelope is closed */
    -webkit-tap-highlight-color: transparent;
    transition: background-color .2s ease, box-shadow .2s ease;
  }
  .map-link:hover, .map-link:focus-visible {
    background: rgba(45, 74, 138, .10);
    box-shadow: 0 0 0 2px rgba(45, 74, 138, .45);
    outline: none;
  }
  .scene.is-settled .map-link {
    visibility: visible;
    animation: map-nudge 2.2s ease .5s 2;   /* a gentle pulse so people notice it is tappable */
  }
  @keyframes map-nudge {
    0%, 100% { box-shadow: 0 0 0 0 rgba(45, 74, 138, 0); }
    45%      { box-shadow: 0 0 0 4px rgba(45, 74, 138, .35); background: rgba(45, 74, 138, .08); }
  }
  .scene.is-open .card {
    transform: translate(-50%, -50%) scale(1.04);
    box-shadow: 0 34px 60px -20px var(--shadow), 0 12px 26px -12px var(--shadow);
    transition: transform 1.4s var(--ease-soft) .95s, box-shadow 1.4s ease .95s;
  }

  /* ---------- The two doors of the envelope ---------- */
  .doors {
    position: absolute; inset: 0; z-index: 2;
    perspective: 2200px;
    pointer-events: none;
  }
  .door {
    position: absolute; top: 0; height: 100%;
    transform-style: preserve-3d;
    will-change: transform;
    transition: transform 1.5s var(--ease-door) .6s;   /* closing: wait for the card to settle */
  }
  .door--left  { left: 0;  width: calc(50.67% + .5px); transform-origin: left center; }
  .door--right { right: 0; width: 49.33%;              transform-origin: right center; }

  .face {
    position: absolute; inset: 0;
    -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
  }
  .front {
    background-repeat: no-repeat;
    background-size: 100% 100%;
  }
  .door--left  .front { background-image: url("images/env-left.jpg");  border-radius: 3px 0 0 3px; }
  .door--right .front { background-image: url("images/env-right.jpg"); border-radius: 0 3px 3px 0; }

  /* the door darkens a little as it turns away from the light */
  .front::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: rgba(18, 28, 60, .55);
    opacity: 0;
    transition: opacity 1.7s ease;
  }
  .scene.is-open .front::after { opacity: 1; }

  /* inside of the envelope, seen once a door swings past 90° */
  .back {
    transform: rotateY(180deg);
    border-radius: 3px;
    background: linear-gradient(180deg, var(--liner-a), var(--liner-b));
    box-shadow: 0 16px 34px -14px var(--shadow);
  }
  .back::before {
    content: ""; position: absolute; inset: 5%;
    border: 1px solid rgba(45, 74, 138, .35);
    border-radius: 2px;
  }

  /* the seal cracks, then the doors part */
  .scene.is-cracking:not(.is-open) .door {
    transition: transform .26s ease-out 0s;
  }
  .scene.is-cracking:not(.is-open) .door--left  { transform: translateX(-2px) rotateY(-5deg); }
  .scene.is-cracking:not(.is-open) .door--right { transform: translateX(2px)  rotateY(5deg); }

  .scene.is-open .door { transition: transform 1.7s var(--ease-door) 0s; }
  .scene.is-open .door--left  { transform: rotateY(-168deg); }
  .scene.is-open .door--right { transform: rotateY(168deg); }

  /* ---------- The seal (the only thing to press) ---------- */
  .seal {
    position: absolute; z-index: 4;
    left: var(--seal-x); top: var(--seal-y);
    width: var(--seal-d); aspect-ratio: 1;
    padding: 0; border: 0; border-radius: 50%;
    background: transparent;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transform: translate(-50%, -50%);
    transition: transform .25s ease, opacity .5s ease 2.2s;
  }
  .seal:hover  { transform: translate(-50%, -50%) scale(1.05); }
  .seal:active { transform: translate(-50%, -50%) scale(.95); }
  .seal:focus-visible { outline: 2px solid var(--seal-ring); outline-offset: 6px; }
  .seal::before {
    content: ""; position: absolute; inset: -4%;
    border-radius: 50%;
    border: 2px solid var(--seal-ring);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, .4);
    opacity: 0;
    animation: ring 2.8s ease-out 1.8s infinite;
    pointer-events: none;
  }
  @keyframes ring {
    0%   { transform: scale(.96); opacity: .75; }
    70%, 100% { transform: scale(1.4); opacity: 0; }
  }
  .scene.is-cracking .seal { opacity: 0; pointer-events: none; transition: opacity .15s ease 0s; }

  /* silver flecks when the seal breaks */
  .flecks {
    position: absolute; z-index: 5;
    left: var(--seal-x); top: var(--seal-y);
    width: 0; height: 0;
    pointer-events: none;
  }
  .flecks i {
    position: absolute;
    width: var(--s); height: var(--s);
    margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff, #bcc0bb 60%, #8b8f8a);
    animation: fleck .95s cubic-bezier(.15, .7, .3, 1) forwards;
  }
  @keyframes fleck {
    0%   { transform: translate(0, 0) scale(.4); opacity: 1; }
    100% { transform: translate(var(--dx), calc(var(--dy) + 34px)) scale(1); opacity: 0; }
  }

  /* ---------- Caption + close button ---------- */
  .foot { display: grid; place-items: center; min-height: 46px; }
  .hint, .reseal {
    grid-area: 1 / 1;
    font: italic 500 clamp(1.1rem, 3.8vw, 1.3rem) / 1.2 "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    letter-spacing: .01em;
  }
  .hint {
    margin: 0;
    pointer-events: none;          /* never sit on top of the close button */
    color: var(--ink-soft);
    animation: hint-in .9s ease 1.1s backwards;
    transition: opacity .6s ease 1.9s;
  }
  @keyframes hint-in { from { opacity: 0; } to { opacity: 1; } }
  .scene.is-cracking .hint { opacity: 0; transition: opacity .2s ease 0s; }

  .reseal {
    appearance: none; -webkit-appearance: none;
    padding: .55em 1.4em;
    border: 1px solid color-mix(in srgb, var(--ink) 35%, transparent);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    opacity: 0; visibility: hidden; transform: translateY(6px);
    transition: opacity .6s ease, transform .6s ease, visibility 0s linear .6s, background-color .2s ease;
  }
  .reseal:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
  .reseal:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  .scene.is-settled .reseal {
    opacity: 1; visibility: visible; transform: none;
    transition-delay: 0s;
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    .stage, .hint, .scene.is-settled .map-link { animation: none; }
    .seal::before { animation: none; opacity: .6; transform: scale(1.12); }
    .door, .scene.is-open .door, .scene.is-cracking:not(.is-open) .door,
    .front::after, .plate, .seal, .hint { transition-duration: .01s !important; transition-delay: 0s !important; }
    .card, .scene.is-open .card { transition: transform .4s ease, box-shadow .4s ease !important; }
  }
</style>
</head>
<body>
  <main class="scene" id="scene">
    <div class="stage">
      <div class="envelope" id="envelope">
        <div class="plate" aria-hidden="true"></div>

        <div class="card" id="card">
          <img draggable="false" decoding="async"
               src="images/card_ar.jpg"
               alt="Wedding invitation.">

          <!-- Invisible link laid over the location pin + "LIFE EYE RESORT" on the card.
               Replace the href with your exact Google Maps share link. -->
          <a class="map-link" id="mapLink"
             href="https://maps.app.goo.gl/1tRwuy6eHTiR3mmt9"
             target="_blank" rel="noopener"
             aria-label="Open OCIEL VENUE in Google Maps"></a>
        </div>

        <div class="doors" aria-hidden="true">
          <div class="door door--left"><div class="face front"></div><div class="face back"></div></div>
          <div class="door door--right"><div class="face front"></div><div class="face back"></div></div>
        </div>

        <button class="seal" id="seal" type="button" aria-label="Break the seal to open the invitation"></button>
        <div class="flecks" id="flecks" aria-hidden="true"></div>
      </div>
    </div>

    <div class="foot">
      <p class="hint" id="hint">Press the seal to open</p>
      <button class="reseal" id="reseal" type="button" disabled>Close the envelope</button>
    </div>

    <div class="sr-only" role="status" aria-live="polite" id="status"></div>
  </main>

<script>
(function () {
  var scene  = document.getElementById('scene');
  var seal   = document.getElementById('seal');
  var reseal = document.getElementById('reseal');
  var flecks = document.getElementById('flecks');
  var status = document.getElementById('status');

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // crack → doors swing open → card rises; closing plays the same in reverse
  var T = reduce ? { crack: 0, settle: 500, close: 500 }
                 : { crack: 260, settle: 3000, close: 2400 };

  var state = 'closed';

  function burst() {
    for (var i = 0; i < 16; i++) {
      var f = document.createElement('i');
      var angle = Math.random() * Math.PI * 2;
      var dist = 40 + Math.random() * 70;
      f.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      f.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      f.style.setProperty('--s', (3 + Math.random() * 4) + 'px');
      f.style.animationDelay = (Math.random() * 0.08) + 's';
      f.addEventListener('animationend', function (e) { e.target.remove(); });
      flecks.appendChild(f);
    }
  }

  function openEnvelope() {
    if (state !== 'closed') return;
    state = 'opening';
    seal.disabled = true;
    scene.classList.add('is-cracking');
    if (!reduce) burst();

    setTimeout(function () { scene.classList.add('is-open'); }, T.crack);

    setTimeout(function () {
      state = 'open';
      scene.classList.add('is-settled');
      reseal.disabled = false;
      reseal.focus({ preventScroll: true });
      status.textContent = 'The invitation is open.';
    }, T.crack + T.settle);
  }

  function closeEnvelope() {
    if (state !== 'open') return;
    state = 'closing';
    reseal.disabled = true;
    scene.classList.remove('is-settled', 'is-open', 'is-cracking');

    setTimeout(function () {
      state = 'closed';
      seal.disabled = false;
      seal.focus({ preventScroll: true });
      status.textContent = 'The envelope is closed.';
    }, T.close);
  }

  seal.addEventListener('click', openEnvelope);
  reseal.addEventListener('click', closeEnvelope);
})();
</script>
</body>
</html>
